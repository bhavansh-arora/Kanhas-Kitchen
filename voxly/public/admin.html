<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxly HQ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#5b4cf0">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="main" style="margin: 0 auto;">
    <div class="page-head">
      <div class="brand hq" style="padding:0"><picture class="brand-logo"><source srcset="/brand/voxly-logo-white.svg" media="(prefers-color-scheme: dark)"><img src="/brand/voxly-logo.svg" alt="Voxly" height="34" width="110"></picture>
        <div><h1>HQ</h1><p class="muted small" id="who"></p></div></div>
      <div class="spacer"></div>
      <button id="password">Change password</button>
      <button onclick="signOut()">Sign out</button>
      <button class="primary" id="add">+ Onboard a business</button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="card" style="margin-top:18px" id="inqCard">
      <div class="row" style="margin-bottom:8px"><h2>Demo requests</h2><span class="pill accent" id="inqCount" hidden></span><div class="spacer"></div>
        <label class="check small"><input type="checkbox" id="inqAll"> Show handled</label></div>
      <p class="muted small" style="margin-bottom:6px">From the sign-up form on your landing page.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Received</th><th>Business</th><th>Contact</th><th>Interest</th><th>Status</th><th></th></tr></thead>
        <tbody id="inqRows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="row" style="margin-bottom:8px"><h2>Businesses</h2><div class="spacer"></div><input id="search" placeholder="Search businesses…" style="max-width:260px"></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Business</th><th>Owner login</th><th>Plan</th><th>Status</th><th>Messages this month</th><th>Chats</th><th>Leads</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
      </table></div>
    </div>
  </div>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
