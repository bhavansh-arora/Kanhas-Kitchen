services:
  # Named "web", not "app" -- Compose auto-registers a network alias equal
  # to the service name on every network it joins, including the external
  # crm_default. The CRM's own compose file has a service literally named
  # "app" too, and its Caddyfile targets that alias directly
  # (reverse_proxy app:3000) -- a second container aliased "app" on the
  # same network causes Docker's DNS to round-robin between the two,
  # intermittently serving this app's content at the CRM's own domain.
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - kanha-data:/app/data
    # Attaches directly to the CRM's network (see /opt/crm on the shared VPS)
    # so its Caddy can reverse_proxy to this container by name -- no host
    # port needed, same pattern as the Leads Finder app on that box.
    networks:
      - crm_shared

networks:
  crm_shared:
    external: true
    name: crm_default

volumes:
  kanha-data:
