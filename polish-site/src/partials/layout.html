<!doctype html>
<html lang="en-NZ" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Polish">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="https://polish.nz/opengraph.jpg">
  <meta property="og:locale" content="en_NZ">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/polish.css">
  <script>
    window.POLISH_CONFIG = {
      email: "hello@polish.nz",
      bookingEndpoint: "",  /* e.g. a Formspree / Make / Cal.com webhook URL */
      enquiryEndpoint: ""
    };
  </script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-fade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
{{> header}}
  <main id="main">
{{content}}
  </main>
{{> footer}}
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  {{scripts}}
</body>
</html>
