<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c2410c">
  <title>Sign in · Kanha's Kitchen</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="logo.png" alt="Kanha's Kitchen logo" class="login-logo" width="200" height="200"
             onload="if (!this.classList.contains('fallback')) document.body.classList.add('has-logo')" onerror="this.onerror=null;this.src='icon.svg';this.classList.add('fallback')">
        <h1>Kanha's Kitchen</h1>
        <p class="muted">Sign in to manage orders, payments and revenue</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="login-error" id="login-error" role="alert" hidden></div>

        <label class="field">Email
          <input type="email" name="email" id="email" autocomplete="username" inputmode="email" required autofocus placeholder="you@example.com">
        </label>

        <label class="field">Password
          <span class="password-box">
            <input type="password" name="password" id="password" autocomplete="current-password" required placeholder="Your password">
            <button type="button" class="btn-ghost btn-sm" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button>
          </span>
        </label>

        <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in for 30 days</label>

        <button type="submit" class="btn-primary login-submit" id="login-submit">Sign in</button>
      </form>
    </div>
    <p class="login-foot muted small">Orders &amp; payments panel</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
