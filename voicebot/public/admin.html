<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Voicebot</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="main" style="margin: 0 auto;">
    <div class="page-head">
      <div class="brand" style="padding:0"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></div>
        <div><h1>Voicebot admin</h1><p class="muted small" id="who"></p></div></div>
      <div class="spacer"></div>
      <button id="password">Change password</button>
      <button onclick="signOut()">Sign out</button>
      <button class="primary" id="add">+ Onboard a business</button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="card" style="margin-top:18px">
      <div class="row" style="margin-bottom:8px"><h2>Businesses</h2><div class="spacer"></div><input id="search" placeholder="Search businesses…" style="max-width:260px"></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Business</th><th>Owner login</th><th>Status</th><th>Messages this month</th><th>Chats</th><th>Leads</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
      </table></div>
    </div>
  </div>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
