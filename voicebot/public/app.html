<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Voicebot</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></div>
        <div>Voicebot<small id="bizName"></small></div></div>
      <nav class="nav" id="nav">
        <button data-page="overview">Overview</button>
        <button data-page="assistant">Assistant</button>
        <button data-page="knowledge">Knowledge</button>
        <button data-page="conversations">Conversations</button>
        <button data-page="leads">Leads <span class="pill accent badge" id="leadBadge" hidden></span></button>
        <button data-page="settings">Bot settings</button>
        <button data-page="install">Install &amp; test</button>
        <button data-page="account">Account</button>
      </nav>
      <div class="spacer"></div>
      <div class="bottom"><button class="ghost" style="width:100%;justify-content:flex-start" onclick="signOut()">Sign out</button></div>
    </aside>
    <main class="main">
      <div class="banner" id="adminBanner" hidden>You're viewing <b id="adminBiz"></b> as admin.<a href="/admin">Back to admin</a></div>
      <div id="page"></div>
    </main>
  </div>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
