<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Voicebot</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-wrap">
    <form class="card login stack" id="form">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></div>Voicebot</div>
      <h1>Sign in</h1>
      <label class="field">Email<input type="email" name="email" autocomplete="username" required></label>
      <label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in</label>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
