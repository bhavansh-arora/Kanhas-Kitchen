<section class="cta-band" aria-labelledby="cta-title">
  <div class="cta-glow" aria-hidden="true"></div>
  <div class="container cta-grid">
    <div data-reveal>
      <p class="kicker kicker-mint">Your next step</p>
      <h2 id="cta-title" class="display-lg">Ready to stop doubting and start <em>expecting amazing?</em></h2>
    </div>
    <div class="cta-card" data-reveal>
      <p class="cta-card-title">Free 30-minute Power Up call</p>
      <ul class="checks checks-light">
        <li>Get clear on what you want to change</li>
        <li>Find out if S.H.I.N.E. coaching fits</li>
        <li>No pressure and no obligation</li>
      </ul>
      <a class="btn btn-mint btn-block" href="contact.html#book">Choose a time {{> arrow}}</a>
      <p class="cta-alt">Prefer email? <a href="mailto:{{site.email}}">{{site.email}}</a></p>
    </div>
  </div>
</section>
