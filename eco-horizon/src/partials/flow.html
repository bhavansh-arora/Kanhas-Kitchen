<div class="flow" data-flow data-reveal="scale">
  <div class="flow__stage">
    <svg class="flow__svg" viewBox="0 0 640 490" role="img" aria-labelledby="flow-title">
      <title id="flow-title">Energy flowing between solar panels, home, battery, EV charger and the grid through the day</title>
      <defs>
        <linearGradient id="flowGrad" x1="0" x2="1"><stop offset="0" stop-color="#fdb813"/><stop offset="1" stop-color="#f05323"/></linearGradient>
        <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#fdb813"/><stop offset="1" stop-color="#f05323" stop-opacity="0"/></radialGradient>
      </defs>
      <path d="M30 196 Q320 -74 610 196" fill="none" stroke="rgba(238,240,232,.14)" stroke-dasharray="3 7"/>
      <line x1="0" y1="196" x2="640" y2="196" stroke="rgba(238,240,232,.08)"/>
      <g data-sun>
        <circle r="46" fill="url(#sunGlow)" opacity=".55"/>
        <circle r="15" fill="#fdb813"/>
      </g>
      <g data-moon opacity="0">
        <circle r="12" fill="#e8ecf5"/>
        <circle r="12" cx="6" cy="-4" fill="#0b1a2c"/>
      </g>

      <path class="wire" d="M320 214 L320 262"/>
      <path class="wire" d="M282 300 L180 300"/>
      <path class="wire" d="M358 300 L460 300"/>
      <path class="wire" d="M300 334 C292 378 232 372 212 400"/>
      <path class="wire" d="M340 334 C348 378 408 372 428 400"/>
      <path class="pulse" data-wire="solar" d="M320 214 L320 262"/>
      <path class="pulse" data-wire="home" d="M282 300 L180 300"/>
      <path class="pulse" data-wire="batt" d="M358 300 L460 300"/>
      <path class="pulse" data-wire="ev" d="M300 334 C292 378 232 372 212 400"/>
      <path class="pulse" data-wire="grid" d="M340 334 C348 378 408 372 428 400"/>

      <g class="node" transform="translate(245 150)">
        <rect width="150" height="64" rx="16"/>
        <use href="#i-panel" class="icon" x="14" y="20" width="24" height="24"/>
        <text class="k" x="50" y="27">Solar</text>
        <text class="v" x="50" y="50" data-v="solar">0.0 kW</text>
      </g>
      <g class="node" transform="translate(30 268)">
        <rect width="150" height="64" rx="16"/>
        <use href="#i-home" class="icon" x="14" y="20" width="24" height="24"/>
        <text class="k" x="50" y="27">Home</text>
        <text class="v" x="50" y="50" data-v="home">0.0 kW</text>
      </g>
      <g class="node" transform="translate(460 268)">
        <rect width="150" height="64" rx="16"/>
        <use href="#i-battery" class="icon" x="14" y="20" width="24" height="24"/>
        <text class="k" x="50" y="27">Battery</text>
        <text class="v" x="50" y="50" data-v="batt">50%</text>
        <rect x="14" y="54" width="24" height="3" rx="1.5" fill="rgba(238,240,232,.15)"/>
        <rect x="14" y="54" width="12" height="3" rx="1.5" fill="#a6e36e" data-soc-bar/>
      </g>
      <g class="node" transform="translate(110 400)">
        <rect width="150" height="64" rx="16"/>
        <use href="#i-car" class="icon" x="14" y="20" width="24" height="24"/>
        <text class="k" x="50" y="27">EV charger</text>
        <text class="v" x="50" y="50" data-v="ev">0.0 kW</text>
      </g>
      <g class="node" transform="translate(380 400)">
        <rect width="150" height="64" rx="16"/>
        <use href="#i-grid" class="icon" x="14" y="20" width="24" height="24"/>
        <text class="k" x="50" y="27" data-v="gridk">Grid</text>
        <text class="v" x="50" y="50" data-v="grid">0.0 kW</text>
      </g>
      <g transform="translate(320 300)">
        <circle r="38" fill="#0b1611" stroke="url(#flowGrad)" stroke-width="2"/>
        <circle r="48" fill="none" stroke="rgba(253,184,19,.18)" data-hub-ring/>
        <use href="#i-chip" x="-14" y="-14" width="28" height="28" style="color:#fdb813"/>
      </g>
    </svg>
  </div>
  <div class="flow__panel">
    <div class="flow__time">
      <div>
        <p class="label">A day on a 6 kWp roof</p>
        <b class="mt-s" style="display:block" data-flow-clock>12:00</b>
      </div>
      <button class="flow__play" type="button" data-flow-play aria-label="Pause the day"><svg><use href="#i-pause"/></svg></button>
    </div>
    <div>
      <input class="range" type="range" min="5" max="23.5" step="0.05" value="12" data-flow-range aria-label="Time of day">
      <div class="range-scale"><span>05:00</span><span>Noon</span><span>23:30</span></div>
    </div>
    <div class="flow__readouts">
      <div><small>Solar now</small><b data-r="solar">0 kW</b></div>
      <div><small>Battery</small><b data-r="batt">50%</b></div>
      <div><small>Grid</small><b data-r="grid">0 kW</b></div>
      <div><small>Self-powered today</small><b data-r="self">0%</b></div>
    </div>
    <p class="flow__caption" data-flow-caption aria-live="polite"></p>
    <p class="calc__note">Modelled on a typical April day for a 6 kWp array, 10 kWh battery and a 7 kW EV charger with solar-first charging. Your system design will be modelled on your own roof and usage.</p>
  </div>
</div>
