<section class="cta" aria-labelledby="cta-title">
      <div class="cta__rays" aria-hidden="true"></div>
      <div class="cta__sun" aria-hidden="true" data-sunrise></div>
      <div class="container">
        <span class="eyebrow">{{ctaEyebrow}}</span>
        <h2 class="h1" id="cta-title" data-split>{{ctaTitle}}</h2>
        <p class="lead">{{ctaLead}}</p>
        <div class="btn-row">
          <a class="btn btn--grad" href="contact.html" data-quote-link>Book my free consultation <span class="btn__icon" aria-hidden="true"><svg class="icon"><use href="#i-arrow"/></svg></span></a>
          <a class="btn btn--ghost" href="tel:+16477069908"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg> 647-706-9908</a>
        </div>
        <div class="reasons">
          <div class="reason" data-reveal>
            <span class="label">{{r1}}</span>
            <p>{{r1b}}</p>
          </div>
          <div class="reason" data-reveal>
            <span class="label">{{r2}}</span>
            <p>{{r2b}}</p>
          </div>
          <div class="reason" data-reveal>
            <span class="label">{{r3}}</span>
            <p>{{r3b}}</p>
          </div>
        </div>
      </div>
    </section>
