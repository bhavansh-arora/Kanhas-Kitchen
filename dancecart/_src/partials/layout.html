  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0f0a12">

  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <script>
    /* Before first paint: preloader on the first visit of a session,
       a curtain when arriving from another page of the site. */
    (function (d) {
      var h = d.documentElement; h.classList.add('js');
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var s = window.sessionStorage;
        if (!s.getItem('dc-seen')) h.classList.add('is-loading');
        else if (s.getItem('dc-nav')) h.classList.add('is-entering');
        setTimeout(function () { h.classList.remove('is-loading', 'is-entering'); }, 6000);
      } catch (e) {}
    })(document);
  </script>

  <link rel="preload" href="assets/fonts/inter-tight-normal-300-700.woff2" as="font" type="font/woff2" crossorigin>
